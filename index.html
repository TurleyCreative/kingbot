  .chat-col{flex:1;display:flex;flex-direction:column;min-width:0}

function handleFileSelect(input){
  const files=Array.from(input.files);
  for(const f of files){
    if(uploadedFiles.length>=5){addBot("Maximum 5 files \u2014 remove one to add another.");break}

    reader.onload=function(e){
      const dataUrl=e.target.result;
      const contentBytes=dataUrl.split(",")[1];
      uploadedFiles.push({name:f.name,size:f.size,contentType:f.type||"application/octet-stream",contentBytes:contentBytes});

    };
    reader.readAsDataURL(f);

    case"job_code":addUser(val);brief.job_code=val;isInternal=val.toLowerCase()==="internal";panelOpen=true;updatePanel();showPanelIfNeeded();renderInput();if(editingField){returnToReview(`Job code updated to <strong>${esc(val)}</strong>.`);break}typeBot(()=>{addBot(isInternal?"Internal job \u2014 noted. Who's the stakeholder or team requesting this?":`Job code <strong>${esc(val)}</strong> \u2014 got it. Who's the client?`);step="client";renderInput()});break;
    case"client":addUser(val);brief.client=val;updatePanel();renderInput();if(editingField){returnToReview(`Client updated to <strong>${esc(val)}</strong>.`);break}typeBot(()=>{if(!isInternal){addBot("Got it. Before we go further \u2014 is there a budget for this job? If it's TBC or you're not sure, just say so.");step="budget";renderInput()}else{addBot("Good stuff. What format does this need? Pick one or more below.");step="format";renderInput()}});break;
    case"budget":addUser(val);brief.budget=val;updatePanel();renderInput();if(editingField){returnToReview(`Budget updated to <strong>${esc(val)}</strong>.`);break}typeBot(()=>{addBot(`Budget: <strong>${esc(val)}</strong> \u2014 noted. What format does this need? Pick one or more below.`);step="format";renderInput()});break;
    case"format_spec":addUser(val);brief.format_spec=val;updatePanel();renderInput();if(editingField){returnToReview(`Format spec updated.`);break}typeBot(()=>goToDueDate());break;
    case"content_detail":addUser(val);brief.content_detail=val;updatePanel();renderInput();if(editingField){returnToReview(`Content detail updated.`);break}typeBot(()=>{addBot(`Understood. Now the main part \u2014 what do you actually need?<br><br><span style="opacity:.55;font-size:13px">Objectives, key messages, audience, must-haves \u2014 the more detail you can give, the better the output.</span>`,true);step="summary";renderInput()});break;
    case"summary":
      if(val.length<30&&!pushback&&!editingField){addUser(val);brief.summary=val;updatePanel();renderInput();typeBot(()=>{addBot(`That's a little light for a brief. \uD83D\uDE2C<br><br>The team needs to know: <strong>who</strong> it's for, <strong>what</strong> it should achieve, and <strong>what</strong> must be included. A few more lines now will save a lot of back-and-forth later.<br><br><strong>Want to add more, or send as is?</strong>`,true);pushback="summary";renderInput()});return}
      addUser(val);brief.summary=pushback==="summary"?(brief.summary+" "+val):val;pushback=null;updatePanel();renderInput();
      if(editingField){returnToReview(`Brief updated.`);break}
      typeBot(()=>{addBot("Got it. Do you have any content or copy to paste in? This could be draft text, key messages, or existing content for us to work from.<br><br><span style='opacity:.5;font-size:13px'>You can paste as much as you need, or skip if there's nothing yet.</span>");step="content_copy";renderInput()});break;
    case"notes":
      addUser(val);brief.notes=val.toLowerCase()==="none"?"":val;updatePanel();renderInput();
      if(editingField){returnToReview(`Notes updated.`);break}
      typeBot(()=>{
        const saved=getSavedEmail();
        const msg=saved
          ?`Almost done. Last thing \u2014 what's your email so I can CC you on the brief?<br><span style="opacity:.5;font-size:13px">I've got your email from last time if it's the same.</span>`
          :`Almost done. Last thing \u2014 what's your email? I'll CC you on the brief so you have a copy.`;
        addBot(msg);
        step="user_email";renderInput();
      });break;
    default:addUser(val);typeBot(()=>{addBot("Sorry friend, I didn't quite understand that. Let me know if you need help, or we can carry on where we left off.");renderInput()});break;
  }
}

function handleDate(ds){
  if(!ds)return;const bd=bizDays(new Date(),new Date(ds+"T00:00:00")),req=getTimelineReq();addUser(niceDate(ds));
  if(bd<req.min&&!pushback){pendingDate=ds;renderInput();typeBot(()=>{const msg=bd===0?`That's today! For ${req.label}, we need at least <strong>${req.min} business day${req.min!==1?"s":""}</strong>.`:`That's <strong>${bd} business day${bd!==1?"s":""}</strong> \u2014 for ${req.label}, we really need a minimum of <strong>${req.min}</strong>. ${bd<=1?"That's not enough time to deliver quality work.":"Quality will almost certainly be compromised at this pace."}`;addBot(`${msg}<br><br><strong>Pick a new date, or keep this one and we'll flag it as urgent?</strong>`,true);pushback="date";renderInput()});return}
  if(bd<req.ideal){brief.due_date=ds;updatePanel();renderInput();typeBot(()=>{addBot(`<strong>${bd} business day${bd!==1?"s":""}</strong> \u2014 that's doable for ${req.label}, but it's tighter than we'd recommend (ideally <strong>${req.ideal} days</strong>). We'll make it work. \uD83D\uDCAA<br><br>Is the content ready? Copy, images, assets \u2014 everything we need?`);step="content_ready";renderInput()});return}
  brief.due_date=ds;updatePanel();renderInput();
  if(editingField){returnToReview(`Due date updated to <strong>${niceDate(ds)}</strong>.`);return}
  typeBot(()=>{addBot(`<strong>${bd} business days</strong> \u2014 solid timeline for ${req.label}. \uD83D\uDE4C<br><br>Is the content ready to go? Copy, images, assets?`);step="content_ready";renderInput()})
}

function handleContentReady(r){addUser(r?"Yes, content is ready":"No, not yet");brief.content_ready=r;updatePanel();renderInput();if(editingField){returnToReview(`Content status updated.`);return}typeBot(()=>{if(r){addBot(`Great \u2014 content ready to go. \uD83D\uDD25<br><br>Now tell me about the brief itself. What do you need? Objectives, key messages, audience, deliverables.`,true);step="summary"}else{addBot(`No problem \u2014 just bear in mind the timeline doesn't really start until content lands. \u23F3<br><br>What's still outstanding and when do you expect to have it?`,true);step="content_detail"}renderInput()})}

function handlePushback(retry){
  if(pushback==="date"){if(retry){addUser("I'll pick a new date");pushback=null;typeBot(()=>{addBot("Good call. Pick a new date below.");step="due_date";renderInput()})}else{addUser("Keep this date \u2014 it's urgent");brief.due_date=pendingDate;pushback=null;updatePanel();typeBot(()=>{addBot(`Noted \u2014 flagged as urgent. The team will do their best. \uD83C\uDFC3\u200D\u2642\uFE0F<br><br>Is the content ready? Copy, images, assets?`);step="content_ready";renderInput()})}}
  else if(pushback==="summary"){if(retry){addUser("Let me add more detail");pushback=null;typeBot(()=>{addBot("Go for it \u2014 the more context the better. \uD83D\uDC51");step="summary";renderInput()})}else{addUser("Send as is");pushback=null;typeBot(()=>{addBot("Got it. Do you have any content or copy to paste in?<br><span style='opacity:.5;font-size:13px'>Draft text, key messages, etc. Skip if nothing yet.</span>");step="content_copy";renderInput()})}}
  renderInput();
}

/* ====================================
 *  POWER AUTOMATE SEND
 *  Posts brief data + base64 attachments to your webhook.
 *  Power Automate sends the email via your internal Outlook.
 *  user_email is included so you can CC them in the flow.
 * ==================================== */
function buildPayload(){
  const dueDateNice=brief.due_date?niceDate(brief.due_date):"Not set";
  const cs=brief.content_ready===null?"Not specified":brief.content_ready?"Yes":"No \u2014 "+(brief.content_detail||"details pending");
  const fmtLine=brief.format.join(", ")+(brief.format_spec?" ("+brief.format_spec+")":"");
  return {
    user_email: brief.user_email,
    job_code: brief.job_code,
    client: brief.client,
    budget: brief.budget || "N/A",
    format: fmtLine,
    format_spec: brief.format_spec,
    due_date: dueDateNice,
    content_ready: cs,
    summary: brief.summary,
    content_copy: brief.content_copy || "None provided",
    notes: brief.notes || "None",
    ...(uploadedFiles.length > 0 && {
      attachments: uploadedFiles.map(f=>({
        "@odata.type": "#microsoft.graph.fileAttachment",
        "name": f.name,
        "contentType": f.contentType,
        "contentBytes": f.contentBytes
      }))
    })
  };
}

async function handleSend(){
  if(sending)return;
  sending=true;
  const btn=document.getElementById("sendBtn");
  if(btn){btn.disabled=true;btn.textContent="Sending..."}

  try{
    const resp = await fetch(PA_WEBHOOK_URL, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(buildPayload())
    });
    if(!resp.ok) throw new Error("HTTP "+resp.status);

    sent=true;renderInput();
    const fc=uploadedFiles.length;
    typeBot(()=>{addBot(`Brief sent. \uD83D\uDE80${fc?`<br><br><strong>${fc} file${fc>1?'s':''} attached</strong> to the email.`:""}<br><br>A copy has been CC'd to <strong>${esc(brief.user_email)}</strong>.<br><br>The team will review and get back to you if anything's unclear. Cheers for being thorough \u2014 it makes a real difference. \uD83D\uDC51<br><br><span style="opacity:.5;font-size:13px">Refresh to submit another brief.</span>`)},1000);
  }catch(err){
    console.error("Power Automate error:",err);
    sending=false;
    if(btn){btn.disabled=false;btn.textContent="\uD83D\uDC51 Send Brief"}
    typeBot(()=>{addBot(`Something went wrong sending the brief. \uD83D\uDE15<br><br>Try again in a moment, or let the creative team know directly.<br><span style="opacity:.5;font-size:12px">Error: ${esc(err.message)}</span>`);renderInput()});
  }
}

function togglePanel(){panelOpen=!panelOpen;showPanelIfNeeded()}
function showPanelIfNeeded(){const p=document.getElementById("panel"),btn=document.getElementById("togglePanel");if(panelOpen){p.classList.add("open");btn.classList.add("active");btn.textContent="Hide Brief"}else{p.classList.remove("open");btn.classList.remove("active");btn.textContent="Show Brief"}}
function updatePanel(){
  const fmtStr=brief.format.join(", ")+(brief.format_spec?" ("+brief.format_spec+")":"");
  const attachStr=uploadedFiles.map(f=>f.name).join(", ");
  const copyPreview=brief.content_copy?(brief.content_copy.length>100?brief.content_copy.substring(0,100)+"...":brief.content_copy):"";
  const v={job_code:brief.job_code,client:brief.client,budget:brief.budget,format:fmtStr,format_spec:"",due_date:brief.due_date?niceDate(brief.due_date):"",content_ready:brief.content_ready===null?"":brief.content_ready?"Yes \u2705":"No \u2014 "+(brief.content_detail||"pending"),summary:brief.summary,content_copy:copyPreview,attachments:attachStr,notes:brief.notes,user_email:brief.user_email};
  const countFields=[v.job_code,v.client,v.budget,v.format,v.due_date,v.content_ready,v.summary,v.content_copy,v.notes,v.user_email];
  const filled=countFields.filter(Boolean).length;
  const total=isInternal?9:10;
  document.getElementById("panelCount").textContent=`${filled} / ${total} fields locked in`;
  document.getElementById("ringPct").textContent=`${Math.round((filled/total)*100)}%`;
  document.getElementById("ringCircle").setAttribute("stroke-dasharray",`${(filled/total)*106.8} 106.8`);
  const displayFields=FIELDS.filter(f=>{if(f.key==="format_spec")return false;if(f.key==="budget"&&isInternal)return false;return true});
  const editableSteps={job_code:"job_code",client:"client",budget:"budget",format:"format",due_date:"due_date",content_ready:"content_ready",summary:"summary",content_copy:"content_copy",attachments:"attachments",notes:"notes",user_email:"user_email"};
  const isReview=step==="review"&&!sent;
  document.getElementById("panelBody").innerHTML=displayFields.map(f=>{
    const val=f.key==="format"?fmtStr:f.key==="attachments"?attachStr:v[f.key];
    const editBtn=isReview&&editableSteps[f.key]?`<button class="field-edit-btn" onclick="editField('${f.key}')">EDIT</button>`:"";
    return`<div class="field-card ${val?"filled":"empty"}"><div class="field-label">${f.icon} ${f.label}</div><div class="field-value ${val?"":"empty"}">${val?esc(val):"\u2014"}</div>${editBtn}</div>`;
  }).join("");
  const footer=document.getElementById("panelFooter");
  if(sent){footer.className="panel-footer sent";footer.textContent="\u2705 Brief sent"}
  else if(step==="review"){footer.className="panel-footer";footer.textContent="\u2709\uFE0F Brief sends automatically to the creative team"}
  else{footer.textContent=""}
}

const EDIT_CONFIG={
  job_code:{step:"job_code",prompt:"Sure \u2014 what should the job code be?"},
  client:{step:"client",prompt:"No problem \u2014 who should the client be?"},
  budget:{step:"budget",prompt:"What's the budget?"},
  format:{step:"format",prompt:"What format do you need? Pick below."},
  due_date:{step:"due_date",prompt:"Pick a new date below."},
  content_ready:{step:"content_ready",prompt:"Is the content ready?"},
  summary:{step:"summary",prompt:"Go ahead \u2014 update the brief below."},
  content_copy:{step:"content_copy",prompt:"Paste your updated content below."},
  attachments:{step:"attachments",prompt:"Update your attachments below."},
  notes:{step:"notes",prompt:"What should the notes say?"},
  user_email:{step:"user_email",prompt:"What email should we use?"},
};
function editField(key){
  const cfg=EDIT_CONFIG[key];
  if(!cfg)return;
  editingField=true;
  step=cfg.step;
  typeBot(()=>{addBot(`✏️ Editing <strong>${FIELDS.find(f=>f.key===key)?.label||key}</strong>.<br><br>${cfg.prompt}`);renderInput()});
  $msg.scrollTop=$msg.scrollHeight;
}

function initChat(){
  updatePanel();
  typeBot(()=>{
    addBot(`Howdy. \uD83D\uDC51 I'm <strong>K.I.N.G.B.O.T</strong> \u2014 the <strong>Key Info & Needs Gathering, Brief Optimisation Tool</strong>.<br><br>I'll help you put together a brief for the creative team. Just chat normally and I'll collect everything we need. You can see the brief building in the panel on the right.<br><br>When we're done, I'll send it straight to the team \u2014 including any files you attach.`);
    setTimeout(()=>typeBot(()=>{addBot("Let's start \u2014 do you have a job code? If this is internal (marketing, comms, etc.) just type \"internal\".",true);step="job_code";renderInput()},400),300);
  },800);
}
</script>
